# ── FOSVED Office v2 — Render Blueprint ─────────────────────────────────────
# Blueprint управляет ТОЛЬКО стейджингом FO-050 (#182): он единственный сервис,
# создаваемый через Apply. Apply blueprint #276.
#
# Что НЕ в blueprint и почему:
#   fosved-office-v2 (prod)  — существует, настроен в дашборде вручную;
#                              повторное объявление создало бы дубликат.
#   11 cron-джоб             — настроены в дашборде вручную (их живость —
#                              наряд #255); схема в старом render.yaml была
#                              невалидной (docker+startCommand, free у cron) —
#                              валидатор Render отверг её при первом Apply 2026-09-20.
# Перенос prod/кронов под blueprint — отдельное фичер-решение (adopt + платные планы).
#
# Инфра-эпизод 2026-10-27 (gh#1598 в Metalogos-): staging-инстанс подвешен —
# HTTP-ответа нет вообще (curl exit 28 за 120–180с) с тика waker 23:32Z 26.10;
# TLS до edge проходит, классификация: зависший бекинг (не cold-start, не 502).
# Этот коммит — zero-touch ревайв: пуш в main триггерит автодеплой staging,
# свежий контейнер вытесняет зависший. Prod не затрагивается (вне blueprint).

services:
  # ── FO-050 (#182): стейджинг VM-пилота Metalogos (наряд №395) ─────────
  # Харнесс dogfood_staging.mlog ремедиирован на 0.30.0 (наряд FO-050-R, #503):
  # ветка UNTRUSTED_FILE_PATH в on_deny, import dept/team, dept-скоупинг
  # диалогового контура, стаб NightSlot. Бинарь mlog 0.30.0 (ADR-0018): пин
  # mlog-020 снят ОБЯЗАТЕЛЬНО — dept/team.mlog паникует парсер 0.20.0
  # (проверено bin/mlog-020 check, базлайн 09.10), двойная совместимость
  # невозможна. Прод (fosved-office-v2) не затронут.
  # METALOGOS_SERVE_BACKEND=vm по-прежнему отложен (решение владельца 09.10,
  # Вариант 1 «ждать апстрим»): классы «0 таблиц» и «env()-инъекция» исправлены
  # апстримом на main (Metalogos-#1169/#1170, PR #1188) и ждут релиза (0.30.1,
  # окно 12.10) — флип одной строкой env после релиза и перепроверки.
  - type: web
    name: fosved-office-v2-staging
    runtime: docker
    plan: free
    region: frankfurt
    envVars:
      # Секретной группы НЕТ в дашборде (валидатор Render 2026-09-20: non-existent
      # group fosved-secrets) — staging живёт на минималках: sqlite-fallback
      # entrypoint.sh:3, llm_proxy без ключей (по запросу), telegram_monitor выключен
      # (TG_MONITOR_ENABLED unset). Прод-токен бота сюда НЕ давать: два поллера на
      # одном токене ломают прод-бота. Ключи добавлять по потребности вручную.
      - key: MLOG_BIN
        value: ./bin/mlog
      - key: MLOG_ENTRY
        value: dogfood_staging.mlog
      # №349/B.1: бэкенд зафиксирован ЯВНО — VM-дефолт 0.21+ (ADR-0171) не
      # подхватывается молча; VM-хендлеры 0.21+ не видят db_decl (находка №419).
      - key: METALOGOS_SERVE_BACKEND
        value: interpreter
