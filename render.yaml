# ── FOSVED Office v2 — Render Blueprint ─────────────────────────────────────
# Blueprint управляет ТОЛЬКО стейджингом FO-050 (#182): он единственный сервис,
# создаваемый через Apply. Apply blueprint #276.
#
# Что НЕ в blueprint и почему:
#   fosved-office-v2 (prod)  — существует, настроен в дашборде вручную;
#                              повторное объявление создало бы дубликат.
#   11 cron-джоб             — настроены в дашборде вручную (их живость —
#                              наряд #255); схема в старом render.yaml была
#                              невалидной (docker+startCommand, free у cron) —
#                              валидатор Render отверг её при первом Apply 2026-09-20.
# Перенос prod/кронов под blueprint — отдельное фичер-решение (adopt + платные планы).

services:
  # ── FO-050 (#182): стейджинг VM-пилота Metalogos (наряд №395) ─────────
  # Харнесс dogfood_staging.mlog на бинаре mlog-020 (0.20.0 wave-3, main 29de25a):
  # capability-слой (гранты №390, on_deny №392, ledger №393), диалоговый контур
  # заглушен (миграционный долг №327). Прод (fosved-office-v2) не затронут.
  # METALOGOS_SERVE_BACKEND=vm отложен: VM-компилятор 0.20.0 не знает date_now
  # (баг апстрима Metalogos, repro в FO-050) — стейджинг стартует на интерпретаторе,
  # флип одной строкой env после апгрейда бинаря (приедет автосинком blueprint'а).
  - type: web
    name: fosved-office-v2-staging
    runtime: docker
    plan: free
    region: frankfurt
    envVars:
      - fromGroup: fosved-secrets   # существующая группа дашборда (как у prod)
      - key: MLOG_BIN
        value: ./bin/mlog-020
      - key: MLOG_ENTRY
        value: dogfood_staging.mlog
