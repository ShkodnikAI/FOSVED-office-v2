services:
  # ── PostgreSQL (OSP data: Analysis, Indicator, Watchlist, Brier, Bets) ──
  - type: pserv
    name: osp-db
    plan: free
    region: frankfurt

  # ── Main Web Service (existing) ──────────────────────────────────────
  - type: web
    name: fosved-office-v2
    runtime: docker
    plan: free
    region: frankfurt
    envVars:
      - fromGroup: fosved-secrets
      - key: DATABASE_URL
        fromDatabase:
          name: osp-db
          property: connectionString
    # Render free tier: spins down after 15 min inactivity
    # Cron jobs below will keep it alive and collect data

  # ── Cron: Collect News (RSS + GDELT) — каждый час ──────────────────
  - type: cron
    name: collect-news
    runtime: docker
    plan: free
    region: frankfurt
    schedule: "0 * * * *"   # каждый час в :00
    buildCommand: "echo 'cron ready'"
    startCommand: >
      curl -sf
      "https://fosved-office-v2.onrender.com/cron/collect-news?secret=${CRON_SECRET}"
      || echo "collect-news failed (server may be spinning up)"
    envVars:
      - fromGroup: fosved-secrets

  # ── Cron: LZ Daily (GitHub + world news scan) — раз в день 06:10 UTC (09:10 Минск) ─
  # Запускается ПОСЛЕ collect-news (06:00), чтобы в news_cache были свежие данные
  - type: cron
    name: lz-daily
    runtime: docker
    plan: free
    region: frankfurt
    schedule: "10 6 * * *"   # 06:10 UTC = 09:10 Минск
    buildCommand: "echo 'cron ready'"
    startCommand: >
      curl -sf -X POST
      -H "Content-Type: application/json"
      -d '{"dry_run":false}'
      "https://fosved-office-v2.onrender.com/scheduler/lz-daily"
      || echo "lz-daily failed"
    envVars:
      - fromGroup: fosved-secrets

  # ── Cron: Tool-output cleanup (FO-016) — раз в день 06:30 UTC ────────
  # Ретеншн offload-хранилища data/tool_output/ (7 дней по умолчанию)
  - type: cron
    name: tool-output-cleanup
    runtime: docker
    plan: free
    region: frankfurt
    schedule: "30 6 * * *"   # 06:30 UTC = 09:30 Минск
    buildCommand: "echo 'cron ready'"
    startCommand: >
      curl -sf
      "https://fosved-office-v2.onrender.com/cron/cleanup-tool-output?secret=${CRON_SECRET}"
      || echo "tool-output-cleanup failed"
    envVars:
      - fromGroup: fosved-secrets

  # ── Cron: Morning Brief — будни 04:20 UTC (07:20 Минск) ─────────────
  - type: cron
    name: morning-brief
    runtime: docker
    plan: free
    region: frankfurt
    schedule: "20 4 * * 1-5"   # будни 04:20 UTC = 07:20 Минск
    buildCommand: "echo 'cron ready'"
    startCommand: >
      curl -sf -X POST
      -H "Content-Type: application/json"
      -d '{"owner_id":"${OWNER_TELEGRAM_ID}"}'
      "https://fosved-office-v2.onrender.com/scheduler/morning-brief"
      || echo "morning-brief failed"
    envVars:
      - fromGroup: fosved-secrets

  # ── Cron: Watch Sweep — ежедневно 06:00 UTC (09:00 Минск) ────────────
  # Sweeps all active WatchlistItems, checks for deltas, updates lastCheckAt/nextCheckAt
  - type: cron
    name: watch-sweep
    runtime: docker
    plan: free
    region: frankfurt
    schedule: "0 6 * * *"   # 06:00 UTC = 09:00 Минск
    buildCommand: "echo 'cron ready'"
    startCommand: >
      curl -sf -X POST
      -H "Content-Type: application/json"
      "https://fosved-office-v2.onrender.com/scheduler/watch-sweep"
      || echo "watch-sweep failed"
    envVars:
      - fromGroup: fosved-secrets

  # ── Cron: Indicator Pre-Reminders — ежедневно 03:00 UTC (06:00 Минск) ─
  # Finds indicators with verifyDate within 7 days, sends pre-reminder to owner
  - type: cron
    name: indicator-pre-reminders
    runtime: docker
    plan: free
    region: frankfurt
    schedule: "0 3 * * *"   # 03:00 UTC = 06:00 Минск (before morning brief)
    buildCommand: "echo 'cron ready'"
    startCommand: >
      curl -sf -X POST
      -H "Content-Type: application/json"
      -d '{"days_ahead":7}'
      "https://fosved-office-v2.onrender.com/scheduler/indicator-pre-reminders"
      || echo "indicator-pre-reminders failed"
    envVars:
      - fromGroup: fosved-secrets

  # ── Cron: DB Backup (FO-001) — ежедневно 02:00 UTC (05:00 Минск) ────────
  # VACUUM INTO + integrity check + retention (7 copies)
  - type: cron
    name: db-backup
    runtime: docker
    plan: free
    region: frankfurt
    schedule: "0 2 * * *"   # 02:00 UTC = 05:00 Минск
    buildCommand: "echo 'cron ready'"
    startCommand: >
      curl -sf
      "https://fosved-office-v2.onrender.com/cron/backup?secret=${CRON_SECRET}"
      || echo "db-backup failed (server may be spinning up)"
    envVars:
      - fromGroup: fosved-secrets

  # ── Cron: Golden Evals (FO-005) — ежедневно 02:30 UTC (05:30 Минск) ────
  # Прогон golden-наборов по департаментам; регрессия → алерт владельцу.
  # После db-backup (02:00), до консолидации (03:30) и брифа (04:20).
  - type: cron
    name: golden-evals
    runtime: docker
    plan: free
    region: frankfurt
    schedule: "30 2 * * *"   # 02:30 UTC = 05:30 Минск
    buildCommand: "echo 'cron ready'"
    startCommand: >
      curl -sf -X POST
      -H "Content-Type: application/json"
      -d '{}'
      "https://fosved-office-v2.onrender.com/scheduler/golden-evals?secret=${CRON_SECRET}"
      || echo "golden-evals failed (server may be spinning up)"
    envVars:
      - fromGroup: fosved-secrets

  # ── Cron: Memory Consolidation (FO-006) — ежедневно 03:30 UTC (06:30 Минск) ─
  # dialog_history → факты (mem0-паттерн). После бэкапа (02:00), до утреннего брифа (04:20).
  - type: cron
    name: memory-consolidation
    runtime: docker
    plan: free
    region: frankfurt
    schedule: "30 3 * * *"   # 03:30 UTC = 06:30 Минск
    buildCommand: "echo 'cron ready'"
    startCommand: >
      curl -sf -X POST
      -H "Content-Type: application/json"
      -d '{"days":1}'
      "https://fosved-office-v2.onrender.com/cron/consolidate-memory?secret=${CRON_SECRET}"
      || echo "memory-consolidation failed (server may be spinning up)"
    envVars:
      - fromGroup: fosved-secrets

  # ── Cron: Keep-Alive (пинговать сервер каждые 14 мин) ──────────────
  # Render free tier: спит после 15 мин неактивности.
  # Этот крон не даёт серверу уснуть, чтобы другие кроны работали.
  # FO-047: тем же тактом — диспетчер нарядной очереди (/cron/narad-tick):
  # resume зависших и исполнение следующего одобренного наряда.
  - type: cron
    name: keep-alive
    runtime: docker
    plan: free
    region: frankfurt
    schedule: "*/14 * * * *"   # каждые 14 минут
    buildCommand: "echo 'cron ready'"
    startCommand: >
      curl -sf "https://fosved-office-v2.onrender.com/health"
      || echo "keep-alive ping failed";
      curl -sf "https://fosved-office-v2.onrender.com/cron/narad-tick?secret=${CRON_SECRET}"
      || echo "narad-tick failed — очередь нарядов не исполнена"
    envVars:
      - fromGroup: fosved-secrets

# ── Env Group (все секреты в одном месте) ──────────────────────────────
envVarGroups:
  - name: fosved-secrets
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: OWNER_TELEGRAM_ID
        sync: false
      - key: TELEGRAM_ARCHIVE_CHANNEL_ID
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: API_SECRET
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ZAI_API_KEY
        sync: false
      - key: GITHUB_TOKEN_METALOGOS
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: BACKUP_UPLOAD_CMD
        sync: false
      - key: BACKUP_RETENTION
        value: "7"
      # ── FO-014: MCP-контур (github + filesystem) ─────────────────────
      # Осознанное расширение прав: METALOGOS_SERVE_ALLOW_EXEC=1 включает
      # exec/mcp_call в телах роутов (нужно именно для mcp_call, №268).
      # Поверхность сужена allowlist'ом: только office-owned серверы.
      # Изменение allowlist — отдельный коммит + запись в audit_log.
      - key: METALOGOS_SERVE_ALLOW_EXEC
        value: "1"
      # FO-037 A.1: таймаут прогона FORGE (клэмп ядра 1..300, io.rs)
      - key: METALOGOS_EXEC_TIMEOUT_SECS
        value: "60"
      - key: METALOGOS_MCP_ALLOWLIST
        value: "mcp_servers/github,mcp_servers/filesystem,mcp_servers/markets,mcp_servers/web"
      - key: METALOGOS_MCP_TIMEOUT_SECS
        value: "30"
      - key: METALOGOS_AUDIT_LOG_PATH
        value: "/office/data/logs/metalogos_audit.log"
      - key: FOSVED_MCP_FS_ROOT
        value: "/office/data/documents"
      # ── FO-035: FORGE-контур ──────────────────────────────────────────
      # mountPath постоянного диска настраивается в панели Render; сюда — путь.
      - key: FORGE_REPOS_DIR
        value: "/var/forge/repos"
      - key: FORGE_MASTER_KEY
        sync: false
      - key: FORGE_GITHUB_OWNER
        sync: false
      - key: PORT
        value: "10000"
