<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Fosved Office</title>
<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<!-- CSS — cascade order: vars → components → screens → responsive -->
<link rel="stylesheet" href="css/vars.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/screens.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<script>window._apiSecret = '{{API_SECRET}}';</script>

<!-- ═══════════════ APP SHELL ═══════════════ -->
<div class="app-shell">

<!-- ═══════════════ TABLET SIDEBAR ═══════════════ -->
<div class="sidebar">
  <div class="sidebar-brand">FOSVED</div>

  <div class="sidebar-group-label">Офис</div>
  <a class="sidebar-item active" data-route="/" href="#/">
    <span class="dot"></span>Главная
  </a>
  <a class="sidebar-item" data-route="/archive" href="#/archive">
    <span class="dot"></span>Архив
  </a>

  <div class="sidebar-group-label">Коммуникации</div>
  <a class="sidebar-item" data-route="/chat" href="#/chat">
    <span class="dot"></span>Чат
  </a>
  <a class="sidebar-item" data-route="/narads" href="#/narads">
    <span class="dot"></span>Наряды
  </a>

  <div class="sidebar-group-label">Система</div>
  <a class="sidebar-item" data-route="/models" href="#/models">
    <span class="dot"></span>Модели
  </a>
  <a class="sidebar-item" data-route="/economics" href="#/economics">
    <span class="dot"></span>Экономика
  </a>
  <a class="sidebar-item" data-route="/settings" href="#/settings">
    <span class="dot"></span>Настройки
  </a>
</div>

<!-- ═══════════════ MAIN CONTENT ═══════════════ -->
<div class="app-content">
<div id="screen-container"></div>
</div>

<!-- ═══════════════ BOTTOM NAV (Phone) ═══════════════ -->
<nav class="bottom-nav" style="display:none;">
  <button class="nav-item active" data-route="/">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0h4"/></svg>
    Главная
  </button>
  <button class="nav-item" data-route="/chat">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
    Чат
  </button>
  <button class="nav-item" data-route="/models">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M9 9h6M9 13h4"/></svg>
    Модели
  </button>
  <button class="nav-item" data-route="/economics">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20V10M18 20V4M6 20v-4"/></svg>
    Экономика
  </button>
  <button class="nav-item" data-route="/settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
    Настройки
  </button>
</nav>

</div><!-- /.app-shell -->

<script type="module" src="js/api.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
