<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 72" width="320" height="72">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&amp;family=DM+Mono:wght@400&amp;display=swap');
    </style>
  </defs>

  <!-- Dark background -->
  <rect width="320" height="72" fill="#0F0F0F"/>

  <!-- Logomark box -->
  <rect x="8" y="8" width="56" height="56" rx="10" ry="10"
        fill="none" stroke="#F0EDE6" stroke-width="1.5"/>

  <!-- φ symbol -->
  <text x="36" y="48" text-anchor="middle"
        font-family="'Cormorant Garamond', Georgia, serif"
        font-weight="300" font-size="38" fill="#F0EDE6">φ</text>

  <!-- Brand name -->
  <text x="84" y="46" text-anchor="start"
        font-family="'Cormorant Garamond', Georgia, serif"
        font-weight="400" font-size="36" letter-spacing="2"
        fill="#F0EDE6">Fosved</text>

  <!-- Tagline -->
  <text x="85" y="62" text-anchor="start"
        font-family="'DM Mono', 'Courier New', monospace"
        font-weight="400" font-size="9" letter-spacing="1.8"
        fill="#888888">φῶς · веды · light of knowledge</text>
</svg>
