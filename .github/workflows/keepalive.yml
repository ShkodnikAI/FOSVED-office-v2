# Наряд №420 (Metalogos gh#573): waker keep-alive на GitHub Actions.
#
# Роль: единственная внешняя зависимость офиса после cutover — вывод
# free-инстанса Render из сна (prod засыпает после 15 мин без трафика,
# холодный старт роняет ночные задачи). Бизнес-расписания исполняет
# нативный cron Metalogos (dept/schedules.mlog, наряды №418/№419) —
# этот workflow их НЕ дёргает (граница наряда: только /health).
#
# Дрейф расписания: GitHub Actions запускает schedule по best-effort
# (задержки под нагрузкой — минуты и больше). Для keep-alive это приемлемо:
# любой пинг чаще окна сна (15 мин) держит инстанс живым; точное время
# обеспечивает нативный cron.
#
# Секретов нет: /health публичен. workflow_dispatch — ручной пинг из UI.
# Cutover-чеклист и runbook: docs/render-dashboard.md.

name: Keep-alive (waker)

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-alive
  cancel-in-progress: true

jobs:
  ping:
    name: Ping /health (prod + staging)
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - name: Wake prod (blocking)
        run: |
          set -euo pipefail
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 120 https://fosved-office-v2.onrender.com/health)
          echo "prod /health -> HTTP ${code}"
          if [ "${code}" != "200" ]; then
            echo "::error::prod /health ответил ${code} (ожидался 200) — инстанс не проснулся или деградировал"
            exit 1
          fi

      # Стейджинг FO-050 живёт на free-плане и может быть намеренно спящим
      # или выключенным (502 при холодном старте) — пинг неблокирующий.
      - name: Wake staging (non-blocking, while FO-050 active)
        continue-on-error: true
        run: |
          set -uo pipefail
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 120 https://fosved-office-v2-staging.onrender.com/health || true)
          echo "staging /health -> HTTP ${code} (non-blocking)"
