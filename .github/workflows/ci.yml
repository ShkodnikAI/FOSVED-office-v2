name: FOSVED CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'

env:
  PYTHON_VERSION: "3.12"

# gh#306: cancel superseded intermediate runs (final commit is always
# verified in full). Saves billed minutes on hosted runners.
# #443 A.1 (решение владельца 2026-10-02): исполнитель CI — hosted раннеры
# (ubuntu-latest, минуты Actions, лимит 2000/мес). Self-hosted раннеры
# fosved-office-runner-01/02 offline с 2026-09-30 — очередь не разгребалась.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 0: Branch freshness (защита от мержа устаревшей ветки) ──────
  # Адаптировано из практики проекта Metalogos (AGENTS.md, §4/§8) —
  # там этот класс ошибки (мерж ветки, сильно отставшей от main, риск
  # затереть уже смёрженную работу) ловили вручную дважды, прежде чем
  # автоматизировали. У нас за сессию редизайна Mini App несколько раз
  # приходилось вручную ловить устаревший локальный чекаут — тот же
  # класс проблемы, просто раньше на этапе разработки, не на этапе PR.
  branch-freshness:
    name: Branch freshness (blocking)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check PR base is not stale relative to main
        run: |
          git fetch origin main --quiet
          MERGE_BASE=$(git merge-base HEAD origin/main)
          BEHIND=$(git rev-list --count "${MERGE_BASE}..origin/main")
          echo "PR branch diverged from main at ${MERGE_BASE}"
          echo "main has advanced ${BEHIND} commit(s) since divergence"
          THRESHOLD=20
          if [ "${BEHIND}" -gt "${THRESHOLD}" ]; then
            echo "::error::Эта ветка отстала от main на ${BEHIND} коммитов (порог: ${THRESHOLD})."
            echo "::error::Прямой мерж отсюда рискует откатить уже смёрженную в main работу."
            echo "::error::Обнови ветку (rebase или merge main в неё) перед ревью."
            exit 1
          fi


  # ── Job 1: Python tests (pytest) ─────────────────────────────────────
  pytest:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: pip install -r requirements.txt pytest

      - name: Run pytest
        # #443: env НЕ задаём — тесты герметичны (conftest + каждый файл ставит
        # свои env ДО импорта прокси). Заданные здесь API_SECRET/WEBHOOK_SECRET
        # активировали auth-режим на первом импорте proxy.core с чужим тестам
        # секретом — 88 падений 401 на первом прогоне hosted-раннера (лог job
        # 110480201886). Отсутствие env = open mode первого импорта = та же
        # среда, в которой локальный полный pytest зелёный.
        run: pytest tests/ -v --tb=short

      - name: Run SEC-3 webhook secret test
        env:
          TELEGRAM_WEBHOOK_SECRET: test-secret-123
        run: python3 scripts/test_sec3.py

  # ── Job 1b: FO-007 error-hygiene policy ──────────────────────────────
  error-hygiene:
    name: No silent excepts (FO-007)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Silent except policy check
        run: python3 scripts/check_silent_excepts.py

  # ── Job 2: Metalogos check (mlog check) ──────────────────────────────
  mlog-check:
    name: Metalogos syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make mlog executable
        run: chmod +x bin/mlog

      - name: Verify mlog works and print version
        run: |
          VERSION=$(./bin/mlog --version | head -1 | awk '{print $3}')
          echo "mlog version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "ERROR: could not determine mlog version"
            exit 1
          fi

      - name: Check app.mlog for parse errors
        run: |
          set +e
          OUTPUT=$(./bin/mlog check app.mlog 2>&1)
          RC=$?
          set -e
          echo "$OUTPUT"
          if [ $RC -ne 0 ] && ! echo "$OUTPUT" | grep -q "parse error"; then
            echo "WARN: mlog check exited with $RC but no parse errors found (may be warnings only)"
          fi
          if echo "$OUTPUT" | grep -q "parse error"; then
            echo "FAIL: parse errors found in app.mlog"
            exit 1
          fi
          echo "OK: no parse errors (exit code: $RC)"

      - name: Check dept/*.mlog for parse errors
        run: |
          FAIL=0
          for f in dept/*.mlog; do
            echo "Checking $f..."
            set +e
            OUTPUT=$(./bin/mlog check "$f" 2>&1)
            set -e
            if echo "$OUTPUT" | grep -q "parse error"; then
              echo "FAIL: parse errors in $f"
              echo "$OUTPUT"
              FAIL=1
            fi
          done
          exit $FAIL

      - name: Check dogfood_staging.mlog with mlog-020 (наряд №395)
        run: |
          chmod +x bin/mlog-020
          VERSION=$(./bin/mlog-020 --version | head -1 | awk '{print $3}')
          echo "mlog-020 version: $VERSION"
          set +e
          OUTPUT=$(./bin/mlog-020 check dogfood_staging.mlog 2>&1)
          RC=$?
          set -e
          echo "$OUTPUT" | tail -5
          if echo "$OUTPUT" | grep -q "parse error"; then
            echo "FAIL: parse errors in dogfood_staging.mlog"
            exit 1
          fi
          echo "OK: dogfood_staging.mlog parses under 0.20 (exit code: $RC)"

      # ── №312: Category-A аудит dept-файлов — гвард «долг не растёт» ──
      # Контракт: audit rc=0 — чисто; rc=2 — только warnings (легально);
      # rc=1 ИЛИ наличие [ERROR] — провал. Бинарь 0.27.1 (vendored
      # прошлый-хороший, ADR-0015: паритет 0.28.0 ≡ 0.27.1 на dept-файлах
      # проверен при переходе — 0 parse errors, 0 [ERROR] на обоих;
      # байт-идентичность 0.25 ≡ 0.27 — B.2.3 перехода 0.27.0, 27/27 файлов;
      # 0.25/0.27 выведены из репо, история git хранит).
      - name: Audit dept/*.mlog — 0 Category-A errors (наряд №312)
        run: |
          chmod +x bin/mlog-0271
          FAIL=0
          for f in dept/*.mlog; do
            set +e
            OUTPUT=$(./bin/mlog-0271 audit "$f" 2>&1)
            RC=$?
            set -e
            ERRS=$(echo "$OUTPUT" | grep -c "^\[ERROR\]" || true)
            if [ "$RC" -eq 1 ] || [ "$ERRS" -gt 0 ]; then
              echo "FAIL: audit $f → rc=$RC, errors=$ERRS"
              echo "$OUTPUT" | grep "^\[ERROR\]" | head -10
              FAIL=1
            else
              echo "OK: $f (rc=$RC, errors=0)"
            fi
          done
          if [ "$FAIL" -ne 0 ]; then
            echo "FAIL: Category-A долг в dept-файлах — см. наряд №312 (гвард долга №327)"
            exit 1
          fi
          echo "OK: audit dept/*.mlog — 0 errors по всем файлам"

      # ── #446/#449: мёртвые вызовы + DEAD-паттерны — «долг не растёт» ──────
      # detector сам по себе exit 1 при ЛЮБЫХ мёртвых (в т.ч. известный
      # ложняк /cron/) — его вывод оценивает dead_pattern_gate.py, поэтому
      # detector запускаем с || true.
      - name: Dead code gates (naryad #446 + #449 A.4)
        run: |
          python3 scripts/deadcall_detector.py > /tmp/deadcalls.txt || true
          python3 scripts/dead_pattern_gate.py

      # ── #519 A.3: батарея test_*v3.mlog под мостом №391 — долг не копится молча ──
      # 12 корневых файлов (forge1-9, narad1-3), 175+ проверок. profile legacy в шапках
      # файлов — тот же мост ADR-0161, что augmented app.mlog прода (entrypoint.sh);
      # деструктивный SQL — под грантами ADR-0155. env — ФИКТИВНЫЕ тестовые значения
      # (census entrypoint.sh; значения >=8 символов — гвард маскирования length>=8).
      - name: v3 battery (test_*v3.mlog, naryad #519)
        timeout-minutes: 10
        env:
          METALOGOS_ALLOW_EXEC: "1"
          FORGE_RUN_ENABLED: "1"
          FORGE_RUN_VLIMIT_KB: "64"
          METALOGOS_EXEC_TIMEOUT_SECS: "30"
          OWNER_TELEGRAM_ID: "99999"
          TELEGRAM_BOT_TOKEN: "test-bot-token-123456"
          TELEGRAM_WEBHOOK_SECRET: "wh-secret-12345678"
          API_SECRET: "api-token-123456"
          CRON_SECRET: "cron-token-123456"
          GITHUB_TOKEN_METALOGOS: "gh-token-12345678"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEEPSEEK_API_KEY: "deepseek-token-12345"
          ZAI_API_KEY: "zai-token-12345678"
          KIMI_API_KEY: "kimi-token-12345678"
          GROQ_API_KEY: "groq-token-12345678"
          GROK_API_KEY: "grok-token-12345678"
          ANTHROPIC_API_KEY: "anth-token-12345678"
          OPENAI_API_KEY: "oai-token-12345678"
          CEREBRAS_API_KEY: "cerebras-12345678"
          NVIDIA_API_KEY: "nvidia-token-1234567"
          TAVILY_API_KEY: "tavily-token-1234567"
          YANDEX_MARKET_API_KEY: "yandex-market-123456"
          SAKANA_API_KEY: "sakana-token-1234567"
          LOCKDOWN_PASSWORD: "lockdown-pass-123456"
          TELEGRAM_ARCHIVE_CHANNEL_ID: "-1"
          SHOP_ENABLED: "0"
          FORGE_GITHUB_OWNER: "test-owner"
          RENDER_URL: "http://127.0.0.1:9999"
        run: |
          # #535 A.2: тесты батареи пишут БД в зашитые /tmp/forge-test*/ и
          # /tmp/narad-test*/ (grep по самим файлам) и используют forge-tmp/
          # (в .gitignore — в чекауте нет). На чистом раннере без каталогов —
          # 0/12 «no database connection» (аудит 17.10).
          mkdir -p forge-tmp
          for d in $(grep -ho 'sqlite:/tmp/[^"]*' test_*v3.mlog test_n588_night.mlog | sed -E 's#^sqlite:##; s#/[^/]*$##' | sort -u); do
            rm -rf "$d" && mkdir -p "$d"
          done
          # #535 (PR #537, прогон 38997094972): вложенный exec ForgeRun зовёт
          # системный python3 -m pytest (forge3/forge6) — на ubuntu-latest он
          # НЕ предустановлен -> «Автопрогон pytest: FAIL», батарея 10/12.
          # Джоба mlog-check не ставит requirements, ставим в самом шаге.
          python3 -c "import pytest" 2>/dev/null || \
            python3 -m pip install --quiet --break-system-packages pytest
          OK=0; FAIL=0
          for f in test_forge{1..9}v3.mlog test_narad{1..3}v3.mlog test_n550v3.mlog test_n553v3.mlog test_n556v3.mlog test_n565v3.mlog test_n566v3.mlog test_n559v3.mlog test_n588_night.mlog; do
            N=$(echo "$f" | sed -E 's/test_(forge|narad)([0-9]+)v3/\2/')
            D=/tmp/n519-$N; rm -rf "$D" && mkdir -p "$D"
            export FORGE_REPOS_DIR="$D"
            out=$(timeout 180 ./bin/mlog run "$f" 2>&1 | grep -vE "REDACT\[|audit-event")
            rc=$?
            if [ $rc -eq 0 ] && echo "$out" | grep -q "ALL PASS"; then
              echo "OK   $f"; OK=$((OK+1))
            else
              echo "FAIL $f (RC=$rc)"; echo "$out" | grep -E "error|FAIL " | head -5; FAIL=$((FAIL+1))
            fi
          done
          echo "v3 battery: OK=$OK FAIL=$FAIL"
          [ "$FAIL" -eq 0 ]

  # ── Job 3: Version consistency ────────────────────────────────────────
  version-check:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make mlog executable
        run: chmod +x bin/mlog

      - name: Check Dockerfile version matches binary
        run: |
          BINARY_VER=$(./bin/mlog --version | head -1 | awk '{print $3}')
          DOCKERFILE_VER=$(grep -oP 'Metalogos v\K[0-9]+\.[0-9]+\.[0-9]+' Dockerfile)
          echo "Binary: $BINARY_VER  Dockerfile: $DOCKERFILE_VER"
          if [ -z "$DOCKERFILE_VER" ]; then
            echo "WARN: no Metalogos version found in Dockerfile"
            exit 0
          fi
          if [ "$BINARY_VER" != "$DOCKERFILE_VER" ]; then
            echo "FAIL: Dockerfile says $DOCKERFILE_VER but binary is $BINARY_VER"
            exit 1
          fi

      - name: Check README version matches binary
        run: |
          BINARY_VER=$(./bin/mlog --version | head -1 | awk '{print $3}')
          README_VER=$(grep -oP 'Metalogos v\K[0-9]+\.[0-9]+\.[0-9]+' README.md | head -1)
          echo "Binary: $BINARY_VER  README: $README_VER"
          if [ -z "$README_VER" ]; then
            echo "WARN: no Metalogos version found in README"
            exit 0
          fi
          if [ "$BINARY_VER" != "$README_VER" ]; then
            echo "FAIL: README says $README_VER but binary is $BINARY_VER"
            exit 1
          fi

      - name: No old backup binaries
        run: |
          if ls bin/mlog_old_* 2>/dev/null; then
            echo "FAIL: old backup binaries found in bin/"
            exit 1
          fi
          echo "OK: no old backup binaries"

  # ── Job 4: Docker build ──────────────────────────────────────────────
  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # gh#306: на hosted раннере docker есть всегда; degrade-логика
      # сохранена как страховка (локальный запуск workflow через act и т.п.).
      # Прод-образ собирает Render из того же Dockerfile при деплое.
      - name: Detect docker availability
        id: detect
        run: |
          if command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
            echo "available=yes" >> "$GITHUB_OUTPUT"
          else
            echo "available=no" >> "$GITHUB_OUTPUT"
            echo "::warning::docker недоступен на раннере — Docker build пропущен (прод-образ собирает Render из того же Dockerfile)"
          fi

      - name: Build Docker image
        if: steps.detect.outputs.available == 'yes'
        run: docker build -t fosved-office-ci .

      - name: Verify mlog works in container
        if: steps.detect.outputs.available == 'yes'
        run: |
          VER=$(docker run --rm fosved-office-ci /usr/local/bin/mlog --version | head -1)
          echo "Container mlog: $VER"
          if [ -z "$VER" ]; then
            echo "ERROR: mlog --version returned nothing in container"
            exit 1
          fi

  # ── Job 5: Smoke against local lift (FO-002) ─────────────────────────
  # Фасад поднимается с тестовыми env, smoke.py в режиме доступности
  # (SMOKE_LOCAL=1) проверяет живость и SEC-4 защиту журнала.
  # Реальные LLM-сценарии остаются production-режимом (scripts/SMOKE.md).
  smoke:
    name: Smoke test (local lift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Start office facade (llm_proxy)
        env:
          API_SECRET: ci-test-secret
          TELEGRAM_WEBHOOK_SECRET: ci-wh-secret
          TELEGRAM_BOT_TOKEN: ci-fake-bot-token
          OWNER_TELEGRAM_ID: "99999"
          DATABASE_PATH: /tmp/fosved-ci-smoke-db
          ZAI_API_KEY: ci-fake-key
        run: |
          python3 llm_proxy.py > /tmp/facade.log 2>&1 &
          echo $! > /tmp/facade.pid
          OK=0
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4000/health > /dev/null 2>&1; then OK=1; break; fi
            sleep 2
          done
          if [ "$OK" != "1" ]; then
            echo "FAIL: facade did not come up on :4000"
            tail -40 /tmp/facade.log
            exit 1
          fi
          echo "Facade is up: $(curl -s http://127.0.0.1:4000/health)"

      - name: Run smoke (availability mode)
        env:
          BASE_URL: http://127.0.0.1:4000
          OWNER_ID: "99999"
          BOT_TOKEN: ci-fake-bot-token
          WEBHOOK_SECRET: ci-wh-secret
          SMOKE_LOCAL: "1"
        run: python3 scripts/smoke.py

      - name: Facade log (on failure)
        if: failure()
        run: tail -60 /tmp/facade.log

  # ── #500 A.1: гейт деплоя — прод только по зелёному CI ──────────────
  # Render перестаёт авто-деплоить main ТОЛЬКО после того, как владелец
  # задаст секрет RENDER_DEPLOY_HOOK и проверит A.4 (действия владельца,
  # не исполнителя). Пока секрета нет — джоба честно предупреждает и
  # пропускает деплой-триггер (main остаётся зелёным, авто-деплой работает
  # как раньше); после A.3/A.4 владельца деплой идёт строго через этот
  # гейт: curl на Deploy Hook выполняется только если ВСЕ блокирующие
  # джобы выше зелёные.
  deploy:
    name: Deploy gate (Render, green only)
    runs-on: ubuntu-latest
    needs: [pytest, error-hygiene, mlog-check, version-check, docker-build, smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Render deploy hook (pinned to github.sha — #524 A.2/A.3)
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::error::Секрет RENDER_DEPLOY_HOOK не задан (#500 A.3 — действие владельца: Render → Settings → Deploy Hook → GitHub Secrets). Деплой НЕ выполнен. Наряд #524 A.1: зелёного статуса без деплоя больше нет — джоба падает, notify-red уведомит владельца."
            exit 1
          fi
          echo "Все блокирующие джобы зелёные — деплой коммита $COMMIT_SHA по хуку"
          # #524 A.2: Render деплоит по умолчанию HEAD ветки, а не проверенный
          # коммит. Параметр ref хука задаёт коммит — сверено с документацией:
          # docs.render.com/deploy-hooks, раздел «Deploying a specific Git commit»:
          # "You can specify a commit SHA to deploy by appending the ref query
          # parameter to your deploy hook URL" (404-кейс подтверждает: SHA ищется
          # в связанном репозитории). Хук-URL всегда содержит ?key=, дописываем &ref=.
          RESP=$(curl -fsS -X POST "${RENDER_DEPLOY_HOOK}&ref=${COMMIT_SHA}")
          echo "$RESP"
          # #524 A.3: ответ хука содержит id деплоя — логируем и проверяем,
          # что Render принял деплой проверенного коммита.
          # Фикс гейта (#535, прогон 38998001915): в sh-двойных кавычках \n —
          # литерал (обратный слеш + n), python3 -c получал ";\nprint" как
          # одну строку → SyntaxError → || true → DEPLOY_ID пуст → гейт
          # красный при УСПЕШНОМ деплое (hook принят dep-db9ehutg1s2s738do2n0,
          # ref=0f7a93b). \n убран: "; print" в одну строку shell-строки.
          DEPLOY_ID=$(printf '%s' "$RESP" | python3 -c "import json,sys; print(json.load(sys.stdin).get('deploy',{}).get('id',''))" 2>/dev/null || true)
          if [ -z "$DEPLOY_ID" ]; then
            echo "::error::Ответ хука без deploy.id — Render мог не принять деплой (#524 A.3). Ответ выше."
            exit 1
          fi
          echo "OK: Render принял деплой ${DEPLOY_ID} коммита ${COMMIT_SHA} (#524 A.3)"

  # ── #500 A.2: уведомление владельца о красном коммите в main ─────────
  # Джоба стартует, если ХОТЯ БЫ одна блокирующая джоба упала (needs + if:
  # failure()); секреты TELEGRAM_BOT_TOKEN / OWNER_TELEGRAM_ID — в Actions.
  notify-red:
    name: Notify owner (red commit)
    runs-on: ubuntu-latest
    needs: [pytest, error-hygiene, mlog-check, version-check, docker-build, smoke, deploy]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && failure()
    steps:
      - name: Telegram message to owner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OWNER_TELEGRAM_ID: ${{ secrets.OWNER_TELEGRAM_ID }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          R_PYTEST: ${{ needs.pytest.result }}
          R_HYGIENE: ${{ needs.error-hygiene.result }}
          R_MLOG: ${{ needs.mlog-check.result }}
          R_VERSION: ${{ needs.version-check.result }}
          R_DOCKER: ${{ needs.docker-build.result }}
          R_SMOKE: ${{ needs.smoke.result }}
        run: |
          FAILED=""
          for pair in "Python tests:$R_PYTEST" "Error hygiene:$R_HYGIENE" "Metalogos check:$R_MLOG" "Version check:$R_VERSION" "Docker build:$R_DOCKER" "Smoke:$R_SMOKE"; do
            name="${pair%%:*}"
            res="${pair#*:}"
            if [ "$res" != "success" ] && [ "$res" != "skipped" ]; then
              if [ -n "$FAILED" ]; then FAILED="$FAILED, "; fi
              FAILED="$FAILED$name ($res)"
            fi
          done
          [ -z "$FAILED" ] && FAILED="unknown"
          SHORT="${COMMIT_SHA:0:7}"
          MSG="🔴 Красный коммит ${SHORT} в main. Упали: ${FAILED}. Лог: ${RUN_URL}"
          echo "$MSG"
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$OWNER_TELEGRAM_ID" ]; then
            echo "::warning::Секреты TELEGRAM_BOT_TOKEN / OWNER_TELEGRAM_ID не заданы в Actions — уведомление некуда слать (#500 A.3-смежное, действие владельца)."
            exit 0
          fi
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${OWNER_TELEGRAM_ID}" \
            --data-urlencode "text=${MSG}" > /dev/null
          echo "OK: уведомление отправлено"
