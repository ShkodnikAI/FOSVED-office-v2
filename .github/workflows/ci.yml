name: FOSVED CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'

env:
  PYTHON_VERSION: "3.12"

# gh#306: cancel superseded intermediate runs (final commit is always
# verified in full). Saves billed minutes on hosted runners and serial
# queue time on the self-hosted runner.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 0: Branch freshness (защита от мержа устаревшей ветки) ──────
  # Адаптировано из практики проекта Metalogos (AGENTS.md, §4/§8) —
  # там этот класс ошибки (мерж ветки, сильно отставшей от main, риск
  # затереть уже смёрженную работу) ловили вручную дважды, прежде чем
  # автоматизировали. У нас за сессию редизайна Mini App несколько раз
  # приходилось вручную ловить устаревший локальный чекаут — тот же
  # класс проблемы, просто раньше на этапе разработки, не на этапе PR.
  branch-freshness:
    name: Branch freshness (blocking)
    runs-on: [self-hosted, linux, x64]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check PR base is not stale relative to main
        run: |
          git fetch origin main --quiet
          MERGE_BASE=$(git merge-base HEAD origin/main)
          BEHIND=$(git rev-list --count "${MERGE_BASE}..origin/main")
          echo "PR branch diverged from main at ${MERGE_BASE}"
          echo "main has advanced ${BEHIND} commit(s) since divergence"
          THRESHOLD=20
          if [ "${BEHIND}" -gt "${THRESHOLD}" ]; then
            echo "::error::Эта ветка отстала от main на ${BEHIND} коммитов (порог: ${THRESHOLD})."
            echo "::error::Прямой мерж отсюда рискует откатить уже смёрженную в main работу."
            echo "::error::Обнови ветку (rebase или merge main в неё) перед ревью."
            exit 1
          fi


  # ── Job 1: Python tests (pytest) ─────────────────────────────────────
  pytest:
    name: Python tests
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: pip install -r requirements.txt pytest

      - name: Run pytest
        env:
          API_SECRET: ci-test-secret
          TELEGRAM_WEBHOOK_SECRET: ci-wh-secret
          OWNER_TELEGRAM_ID: "99999"
          DATABASE_PATH: /tmp/fosved-ci-test-db
          ZAI_API_KEY: ci-fake-key
        run: pytest tests/ -v --tb=short

      - name: Run SEC-3 webhook secret test
        env:
          TELEGRAM_WEBHOOK_SECRET: test-secret-123
        run: python3 scripts/test_sec3.py

  # ── Job 1b: FO-007 error-hygiene policy ──────────────────────────────
  error-hygiene:
    name: No silent excepts (FO-007)
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Silent except policy check
        run: python3 scripts/check_silent_excepts.py

  # ── Job 2: Metalogos check (mlog check) ──────────────────────────────
  mlog-check:
    name: Metalogos syntax check
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4

      - name: Make mlog executable
        run: chmod +x bin/mlog

      - name: Verify mlog works and print version
        run: |
          VERSION=$(./bin/mlog --version | head -1 | awk '{print $3}')
          echo "mlog version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "ERROR: could not determine mlog version"
            exit 1
          fi

      - name: Check app.mlog for parse errors
        run: |
          set +e
          OUTPUT=$(./bin/mlog check app.mlog 2>&1)
          RC=$?
          set -e
          echo "$OUTPUT"
          if [ $RC -ne 0 ] && ! echo "$OUTPUT" | grep -q "parse error"; then
            echo "WARN: mlog check exited with $RC but no parse errors found (may be warnings only)"
          fi
          if echo "$OUTPUT" | grep -q "parse error"; then
            echo "FAIL: parse errors found in app.mlog"
            exit 1
          fi
          echo "OK: no parse errors (exit code: $RC)"

      - name: Check dept/*.mlog for parse errors
        run: |
          FAIL=0
          for f in dept/*.mlog; do
            echo "Checking $f..."
            set +e
            OUTPUT=$(./bin/mlog check "$f" 2>&1)
            set -e
            if echo "$OUTPUT" | grep -q "parse error"; then
              echo "FAIL: parse errors in $f"
              echo "$OUTPUT"
              FAIL=1
            fi
          done
          exit $FAIL

      - name: Check dogfood_staging.mlog with mlog-020 (наряд №395)
        run: |
          chmod +x bin/mlog-020
          VERSION=$(./bin/mlog-020 --version | head -1 | awk '{print $3}')
          echo "mlog-020 version: $VERSION"
          set +e
          OUTPUT=$(./bin/mlog-020 check dogfood_staging.mlog 2>&1)
          RC=$?
          set -e
          echo "$OUTPUT" | tail -5
          if echo "$OUTPUT" | grep -q "parse error"; then
            echo "FAIL: parse errors in dogfood_staging.mlog"
            exit 1
          fi
          echo "OK: dogfood_staging.mlog parses under 0.20 (exit code: $RC)"

      # ── №312: Category-A аудит dept-файлов — гвард «долг не растёт» ──
      # Контракт: audit rc=0 — чисто; rc=2 — только warnings (легально);
      # rc=1 ИЛИ наличие [ERROR] — провал. Бинарь 0.24 (vendored прошлый-хороший,
      # ADR-0008: аудит dept на 0.25 ≡ 0.24 байт-идентично — проверено B.2.4,
      # гвард совместим; 0.22/0.23 выведены из репо, история git хранит).
      - name: Audit dept/*.mlog — 0 Category-A errors (наряд №312)
        run: |
          chmod +x bin/mlog-024
          FAIL=0
          for f in dept/*.mlog; do
            set +e
            OUTPUT=$(./bin/mlog-024 audit "$f" 2>&1)
            RC=$?
            set -e
            ERRS=$(echo "$OUTPUT" | grep -c "^\[ERROR\]" || true)
            if [ "$RC" -eq 1 ] || [ "$ERRS" -gt 0 ]; then
              echo "FAIL: audit $f → rc=$RC, errors=$ERRS"
              echo "$OUTPUT" | grep "^\[ERROR\]" | head -10
              FAIL=1
            else
              echo "OK: $f (rc=$RC, errors=0)"
            fi
          done
          if [ "$FAIL" -ne 0 ]; then
            echo "FAIL: Category-A долг в dept-файлах — см. наряд №312 (гвард долга №327)"
            exit 1
          fi
          echo "OK: audit dept/*.mlog — 0 errors по всем файлам"

  # ── Job 3: Version consistency ────────────────────────────────────────
  version-check:
    name: Version consistency
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4

      - name: Make mlog executable
        run: chmod +x bin/mlog

      - name: Check Dockerfile version matches binary
        run: |
          BINARY_VER=$(./bin/mlog --version | head -1 | awk '{print $3}')
          DOCKERFILE_VER=$(grep -oP 'Metalogos v\K[0-9]+\.[0-9]+\.[0-9]+' Dockerfile)
          echo "Binary: $BINARY_VER  Dockerfile: $DOCKERFILE_VER"
          if [ -z "$DOCKERFILE_VER" ]; then
            echo "WARN: no Metalogos version found in Dockerfile"
            exit 0
          fi
          if [ "$BINARY_VER" != "$DOCKERFILE_VER" ]; then
            echo "FAIL: Dockerfile says $DOCKERFILE_VER but binary is $BINARY_VER"
            exit 1
          fi

      - name: Check README version matches binary
        run: |
          BINARY_VER=$(./bin/mlog --version | head -1 | awk '{print $3}')
          README_VER=$(grep -oP 'Metalogos v\K[0-9]+\.[0-9]+\.[0-9]+' README.md | head -1)
          echo "Binary: $BINARY_VER  README: $README_VER"
          if [ -z "$README_VER" ]; then
            echo "WARN: no Metalogos version found in README"
            exit 0
          fi
          if [ "$BINARY_VER" != "$README_VER" ]; then
            echo "FAIL: README says $README_VER but binary is $BINARY_VER"
            exit 1
          fi

      - name: No old backup binaries
        run: |
          if ls bin/mlog_old_* 2>/dev/null; then
            echo "FAIL: old backup binaries found in bin/"
            exit 1
          fi
          echo "OK: no old backup binaries"

  # ── Job 4: Docker build ──────────────────────────────────────────────
  docker-build:
    name: Docker build
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4

      # gh#306: self-hosted runner may lack docker (sandbox). Detect
      # and degrade to an explicit warning instead of a red gate —
      # the production image is built by Render from the same
      # Dockerfile at deploy time. Gate stays blocking on runners
      # where docker exists.
      - name: Detect docker availability
        id: detect
        run: |
          if command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
            echo "available=yes" >> "$GITHUB_OUTPUT"
          else
            echo "available=no" >> "$GITHUB_OUTPUT"
            echo "::warning::docker недоступен на раннере — Docker build пропущен (прод-образ собирает Render из того же Dockerfile)"
          fi

      - name: Build Docker image
        if: steps.detect.outputs.available == 'yes'
        run: docker build -t fosved-office-ci .

      - name: Verify mlog works in container
        if: steps.detect.outputs.available == 'yes'
        run: |
          VER=$(docker run --rm fosved-office-ci /usr/local/bin/mlog --version | head -1)
          echo "Container mlog: $VER"
          if [ -z "$VER" ]; then
            echo "ERROR: mlog --version returned nothing in container"
            exit 1
          fi

  # ── Job 5: Smoke against local lift (FO-002) ─────────────────────────
  # Фасад поднимается с тестовыми env, smoke.py в режиме доступности
  # (SMOKE_LOCAL=1) проверяет живость и SEC-4 защиту журнала.
  # Реальные LLM-сценарии остаются production-режимом (scripts/SMOKE.md).
  smoke:
    name: Smoke test (local lift)
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Start office facade (llm_proxy)
        env:
          API_SECRET: ci-test-secret
          TELEGRAM_WEBHOOK_SECRET: ci-wh-secret
          TELEGRAM_BOT_TOKEN: ci-fake-bot-token
          OWNER_TELEGRAM_ID: "99999"
          DATABASE_PATH: /tmp/fosved-ci-smoke-db
          ZAI_API_KEY: ci-fake-key
        run: |
          python3 llm_proxy.py > /tmp/facade.log 2>&1 &
          echo $! > /tmp/facade.pid
          OK=0
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4000/health > /dev/null 2>&1; then OK=1; break; fi
            sleep 2
          done
          if [ "$OK" != "1" ]; then
            echo "FAIL: facade did not come up on :4000"
            tail -40 /tmp/facade.log
            exit 1
          fi
          echo "Facade is up: $(curl -s http://127.0.0.1:4000/health)"

      - name: Run smoke (availability mode)
        env:
          BASE_URL: http://127.0.0.1:4000
          OWNER_ID: "99999"
          BOT_TOKEN: ci-fake-bot-token
          WEBHOOK_SECRET: ci-wh-secret
          SMOKE_LOCAL: "1"
        run: python3 scripts/smoke.py

      - name: Facade log (on failure)
        if: failure()
        run: tail -60 /tmp/facade.log
